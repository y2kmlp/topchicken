<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOP CHICKEN | الدجاج المميز</title>
  <style>
    :root {
      --primary-yellow: #ffb703;
      --secondary-orange: #fb8500;
      --wood-dark: #2b1e17;
      --wood-light: #3a2a22;
      --bg-dark: #121212;
      --card-bg: #1e1e1e;
      --text-light: #f1f1f1;
      --text-gold: #ffc107;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      padding-bottom: 90px;
    }

    /* Header Banner with Shop Photo Background */
    .header-banner {
      position: relative;
      background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(43, 30, 23, 0.9)), url('shop.jpg');
      background-size: cover;
      background-position: center;
      color: white;
      text-align: center;
      padding: 35px 15px 25px 15px;
      border-bottom: 4px solid var(--primary-yellow);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .header-banner h1 {
      font-size: 2rem;
      color: var(--primary-yellow);
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }

    .header-banner h2 {
      font-size: 1.8rem;
      margin-top: 5px;
      color: #ffffff;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }

    .header-banner p {
      font-size: 0.95rem;
      margin-top: 8px;
      color: #ddd;
    }

    /* Categories Horizontal Scroll */
    .category-container {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 15px 10px;
      background: var(--wood-dark);
      border-bottom: 1px solid #444;
      scrollbar-width: none;
    }

    .category-container::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      flex: 0 0 auto;
      background: var(--wood-light);
      color: var(--text-light);
      border: 1px solid #555;
      padding: 10px 16px;
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      min-width: 95px;
    }

    .cat-btn.active {
      background: var(--primary-yellow);
      color: #000;
      font-weight: bold;
      border-color: var(--secondary-orange);
      transform: scale(1.05);
    }

    .cat-btn .en {
      display: block;
      font-size: 0.85rem;
      margin-top: 2px;
    }

    .cat-btn .ar {
      display: block;
      font-size: 0.95rem;
      font-weight: bold;
    }

    /* Menu Items Grid */
    .menu-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 15px;
      padding: 15px;
      max-width: 800px;
      margin: 0 auto;
    }

    .item-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px;
      border: 1px solid #333;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    .item-title {
      font-size: 1rem;
      font-weight: bold;
      color: var(--text-gold);
    }

    .item-title-en {
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 8px;
    }

    .item-price {
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      margin-bottom: 10px;
    }

    .add-btn {
      background: var(--secondary-orange);
      color: #fff;
      border: none;
      padding: 8px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }

    .add-btn:active {
      transform: scale(0.98);
    }

    /* Bottom Cart Bar */
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--wood-dark);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 2px solid var(--primary-yellow);
      box-shadow: 0 -4px 10px rgba(0,0,0,0.5);
    }

    .cart-info {
      font-size: 1rem;
    }

    .cart-info div {
      color: var(--primary-yellow);
      font-weight: bold;
    }

    .view-cart-btn {
      background: var(--primary-yellow);
      color: #000;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header-banner">
    <h1>TOP CHICKEN</h1>
    <h2>الدجاج المميز</h2>
    <p>وجبات سريعة و بروست لذيذ | Fast Food & Delicious Broast</p>
  </div>

  <!-- Categories -->
  <div class="category-container" id="categoryContainer"></div>

  <!-- Product List -->
  <div class="menu-container" id="menuContainer"></div>

  <!-- Bottom Cart Bar -->
  <div class="cart-bar">
    <div class="cart-info">
      <span id="cartCount">0</span> عناصر (Items)
      <div id="cartTotal">0 SAR</div>
    </div>
    <button class="view-cart-btn" onclick="alert('سلة التسوق قيد التطوير')">عرض السلة / View Cart</button>
  </div>

  <script>
    // Categories Data
    const categories = [
      { id: 'broast', ar: 'بروست', en: 'Broast' },
      { id: 'burger', ar: 'برجر', en: 'Burger' },
      { id: 'tortilla', ar: 'تورتيلا', en: 'Tortilla' },
      { id: 'pizza', ar: 'بيتزا', en: 'Pizza' },
      { id: 'meals', ar: 'وجبات / بطاطس', en: 'Meals/Fries' },
      { id: 'pepsi', ar: 'بيبسي', en: 'Pepsi' },
      { id: 'jumbo', ar: 'جامبو', en: 'Jumbo' },
      { id: 'juices', ar: 'عصائر', en: 'Juices' },
      { id: 'extra', ar: 'إضافات', en: 'Extra' }
    ];

    // Sample Products Data
    const products = {
      broast: [
        { id: 1, ar: 'بروست عادي (4 قطع)', en: 'Regular Broast (4 Pcs)', price: 18 },
        { id: 2, ar: 'بروست حراق (4 قطع)', en: 'Spicy Broast (4 Pcs)', price: 19 }
      ],
      burger: [
        { id: 3, ar: 'برجر دجاج', en: 'Chicken Burger', price: 10 },
        { id: 4, ar: 'برجر لحم', en: 'Beef Burger', price: 12 }
      ],
      tortilla: [
        { id: 5, ar: 'تورتيلا دجاج', en: 'Chicken Tortilla', price: 12 }
      ],
      pizza: [
        { id: 6, ar: 'بيتزا خضار', en: 'Vegetable Pizza', price: 15 }
      ],
      meals: [
        { id: 7, ar: 'بطاطس مقلية', en: 'French Fries', price: 6 }
      ],
      pepsi: [
        { id: 8, ar: 'بيبسي علبة', en: 'Pepsi Can', price: 3 }
      ],
      jumbo: [
        { id: 9, ar: 'جامبو ساندويتش', en: 'Jumbo Sandwich', price: 14 }
      ],
      juices: [
        { id: 10, ar: 'عصير برتقال', en: 'Orange Juice', price: 8 }
      ],
      extra: [
        { id: 11, ar: 'ثوم إضافي', en: 'Extra Garlic', price: 2 }
      ]
    };

    let cart = [];
    let currentCategory = 'broast';

    // Render Categories
    function renderCategories() {
      const container = document.getElementById('categoryContainer');
      container.innerHTML = categories.map(cat => `
        <div class="cat-btn ${cat.id === currentCategory ? 'active' : ''}" onclick="selectCategory('${cat.id}')">
          <span class="ar">${cat.ar}</span>
          <span class="en">${cat.en}</span>
        </div>
      `).join('');
    }

    // Select Category
    function selectCategory(catId) {
      currentCategory = catId;
      renderCategories();
      renderProducts();
    }

    // Render Products
    function renderProducts() {
      const container = document.getElementById('menuContainer');
      const items = products[currentCategory] || [];
      
      if(items.length === 0) {
        container.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">لا توجد منتجات حالياً</p>';
        return;
      }

      container.innerHTML = items.map(item => `
        <div class="item-card">
          <div>
            <div class="item-title">${item.ar}</div>
            <div class="item-title-en">${item.en}</div>
          </div>
          <div>
            <div class="item-price">${item.price} SAR</div>
            <button class="add-btn" onclick="addToCart(${item.id}, '${item.ar}', ${item.price})">إضافة / Add</button>
          </div>
        </div>
      `).join('');
    }

    // Add to Cart
    function addToCart(id, name, price) {
      cart.push({ id, name, price });
      updateCart();
    }

    // Update Cart Bar
    function updateCart() {
      document.getElementById('cartCount').innerText = cart.length;
      const total = cart.reduce((sum, item) => sum + item.price, 0);
      document.getElementById('cartTotal').innerText = total + ' SAR';
    }

    // Initialize
    renderCategories();
    renderProducts();
  </script>
</body>
</html>
